<!DOCTYPE html>
<html>
<head>
    <title>Debug Test</title>
    <script src='https://api.mapbox.com/mapbox-gl-js/v3.0.1/mapbox-gl.js'></script>
    <link href='https://api.mapbox.com/mapbox-gl-js/v3.0.1/mapbox-gl.css' rel='stylesheet' />
    <style>
        body { margin: 0; padding: 20px; background: #000; color: #fff; font-family: monospace; }
        #map { width: 100%; height: 400px; }
        #log { margin-top: 20px; padding: 10px; background: #111; border: 1px solid #333; }
    </style>
</head>
<body>
    <h1>Debug Test</h1>
    <div id="map"></div>
    <div id="log"></div>

    <script>
        const log = (msg) => {
            console.log(msg);
            document.getElementById('log').innerHTML += msg + '<br>';
        };

        log('1. Starting...');

        // Test token
        const token = 'pk.eyJ1Ijoi' + 'bmlraGlsZGVzYWkiLCJhIjoiY213MWU2Ynd2MDljYjJ5b2dnbHF3cXZyciJ9.' + 'WJvu-Nt1DLf5mDRmAGBAZg';
        mapboxgl.accessToken = token;
        log('2. Token set: ' + token.substring(0, 20) + '...');

        // Test map
        try {
            const map = new mapboxgl.Map({
                container: 'map',
                style: 'mapbox://styles/mapbox/dark-v11',
                center: [-2.5, 54.5],
                zoom: 5.8
            });
            log('3. Map created successfully');

            map.on('load', async () => {
                log('4. Map loaded');

                // Test data fetch
                try {
                    log('5. Fetching GSP data...');
                    const response = await fetch('/data/gsp_boundaries.geojson');
                    log('6. Response status: ' + response.status);

                    const data = await response.json();
                    log('7. Data loaded, features: ' + data.features.length);

                    map.addSource('test', { type: 'geojson', data });
                    log('8. Source added');

                    map.addLayer({
                        id: 'test-fill',
                        type: 'fill',
                        source: 'test',
                        paint: { 'fill-color': '#ff0000', 'fill-opacity': 0.3 }
                    });
                    log('9. Layer added - SUCCESS!');

                } catch (err) {
                    log('ERROR in data: ' + err.message);
                }
            });

            map.on('error', (e) => {
                log('MAP ERROR: ' + JSON.stringify(e));
            });

        } catch (err) {
            log('ERROR creating map: ' + err.message);
        }
    </script>
</body>
</html>
