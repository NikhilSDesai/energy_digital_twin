<!DOCTYPE html>
<html>
<head>
    <title>Transmission Test</title>
    <script src='https://api.mapbox.com/mapbox-gl-js/v3.0.1/mapbox-gl.js'></script>
    <link href='https://api.mapbox.com/mapbox-gl-js/v3.0.1/mapbox-gl.css' rel='stylesheet' />
    <style>
        body { margin: 0; padding: 0; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }
        #status { position: absolute; top: 10px; left: 10px; background: white; padding: 10px; z-index: 1000; font-family: monospace; font-size: 12px; }
    </style>
</head>
<body>
    <div id="status">Loading...</div>
    <div id="map"></div>

    <script>
        const status = document.getElementById('status');

        mapboxgl.accessToken = 'pk.eyJ1Ijoi' + 'bmlraGlsZGVzYWkiLCJhIjoiY213MWU2Ynd2MDljYjJ5b2dnbHF3cXZyciJ9.' + 'WJvu-Nt1DLf5mDRmAGBAZg';

        const map = new mapboxgl.Map({
            container: 'map',
            style: 'mapbox://styles/mapbox/dark-v11',
            center: [-2.5, 54.5],
            zoom: 5.8
        });

        map.on('load', async function() {
            status.innerHTML = 'Map loaded, fetching transmission lines...';

            try {
                const response = await fetch('/data/transmission_lines.geojson');
                const data = await response.json();

                status.innerHTML = 'Data loaded: ' + data.features.length + ' lines. Adding to map...';

                map.addSource('transmission', {
                    type: 'geojson',
                    data: data
                });

                map.addLayer({
                    id: 'transmission-lines',
                    type: 'line',
                    source: 'transmission',
                    paint: {
                        'line-color': '#d4af37',
                        'line-width': 3,
                        'line-opacity': 1
                    }
                });

                status.innerHTML = '✅ SUCCESS! ' + data.features.length + ' transmission lines visible in muted yellow';
                status.style.background = 'lightgreen';

            } catch (error) {
                status.innerHTML = '❌ ERROR: ' + error.message;
                status.style.background = 'red';
                status.style.color = 'white';
            }
        });
    </script>
</body>
</html>
