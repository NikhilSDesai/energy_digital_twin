<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UK Energy Digital Twin</title>

    <!-- Mapbox GL JS -->
    <script src='https://api.mapbox.com/mapbox-gl-js/v3.0.1/mapbox-gl.js'></script>
    <link href='https://api.mapbox.com/mapbox-gl-js/v3.0.1/mapbox-gl.css' rel='stylesheet' />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #0a0a0a;
            color: #ffffff;
        }

        #map {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 100%;
        }

        /* Header */
        .header {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 1;
            background: rgba(10, 10, 10, 0.9);
            backdrop-filter: blur(10px);
            padding: 20px 30px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 400px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            font-size: 14px;
            color: #999;
            margin-bottom: 15px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: 15px;
        }

        .stat {
            background: rgba(255, 255, 255, 0.05);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .stat-value {
            font-size: 20px;
            font-weight: 700;
            color: #667eea;
            margin-bottom: 4px;
        }

        .stat-label {
            font-size: 11px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Legend */
        .legend {
            position: absolute;
            bottom: 30px;
            right: 20px;
            z-index: 1;
            background: rgba(10, 10, 10, 0.9);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            min-width: 200px;
        }

        .legend h3 {
            font-size: 14px;
            margin-bottom: 12px;
            color: #fff;
            font-weight: 600;
        }

        .legend-item {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
            font-size: 12px;
        }

        .legend-color {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            margin-right: 10px;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        /* Loading */
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2;
            background: rgba(10, 10, 10, 0.95);
            padding: 30px 50px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
        }

        .loading.hidden {
            display: none;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(102, 126, 234, 0.2);
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Mapbox controls styling */
        .mapboxgl-ctrl-group {
            background: rgba(10, 10, 10, 0.9) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
        }

        .mapboxgl-ctrl-group button {
            background: transparent !important;
            color: #fff !important;
        }

        .mapboxgl-ctrl-group button:hover {
            background: rgba(255, 255, 255, 0.1) !important;
        }

        /* Popup styling */
        .mapboxgl-popup-content {
            background: rgba(10, 10, 10, 0.95);
            backdrop-filter: blur(10px);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 15px;
            max-width: 300px;
        }

        .mapboxgl-popup-close-button {
            color: #fff;
            font-size: 20px;
        }

        .popup-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 10px;
            color: #667eea;
        }

        .popup-field {
            font-size: 13px;
            margin-bottom: 6px;
            display: flex;
        }

        .popup-label {
            color: #999;
            margin-right: 8px;
            min-width: 80px;
        }

        .popup-value {
            color: #fff;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <!-- Loading Screen -->
    <div class="loading" id="loading">
        <div class="spinner"></div>
        <div>Loading UK Energy Grid Data...</div>
    </div>

    <!-- Header -->
    <div class="header">
        <h1>UK Energy Digital Twin</h1>
        <p>Connection Queue & Infrastructure</p>

        <div class="stats">
            <div class="stat">
                <div class="stat-value" id="totalProjects">-</div>
                <div class="stat-label">Projects</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="totalCapacity">-</div>
                <div class="stat-label">Total GW</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="gspRegions">329</div>
                <div class="stat-label">GSP Regions</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="connections">-</div>
                <div class="stat-label">Sites</div>
            </div>
        </div>
    </div>

    <!-- Legend -->
    <div class="legend">
        <h3>Plant Types</h3>
        <div class="legend-item">
            <div class="legend-color" style="background: #667eea;"></div>
            <span>Energy Storage</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: #ffd93d;"></div>
            <span>Solar + Storage</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: #6bcf7f;"></div>
            <span>Wind Onshore</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: #4d9de0;"></div>
            <span>Wind Offshore</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: #e15554;"></div>
            <span>CCGT</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: #999;"></div>
            <span>Other</span>
        </div>
    </div>

    <!-- Map Container -->
    <div id="map"></div>

    <script src="config.js" onerror="console.log('Config not found, using embedded token')"></script>
    <script src="app.js"></script>
</body>
</html>
