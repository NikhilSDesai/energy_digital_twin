<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UK Energy Grid</title>

    <!-- Mapbox GL JS -->
    <script src='https://api.mapbox.com/mapbox-gl-js/v3.0.1/mapbox-gl.js'></script>
    <link href='https://api.mapbox.com/mapbox-gl-js/v3.0.1/mapbox-gl.css' rel='stylesheet' />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0e17;
            color: #e0e0e0;
            overflow: hidden;
        }

        #map {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 100%;
        }

        /* Minimal top bar */
        .top-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: rgba(10, 14, 23, 0.7);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            z-index: 10;
        }

        .logo {
            font-size: 16px;
            font-weight: 600;
            letter-spacing: -0.3px;
            color: #fff;
        }

        .stats-mini {
            display: flex;
            gap: 30px;
            font-size: 13px;
        }

        .stat-mini {
            color: #666;
        }

        .stat-mini span {
            color: #fff;
            font-weight: 600;
            margin-left: 6px;
        }

        /* Left sidebar - minimal */
        .sidebar {
            position: absolute;
            left: 0;
            top: 60px;
            bottom: 0;
            width: 280px;
            background: rgba(10, 14, 23, 0.85);
            backdrop-filter: blur(20px);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            padding: 30px 20px;
            z-index: 9;
            overflow-y: auto;
        }

        .sidebar h3 {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #666;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .layer-toggle {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            margin-bottom: 6px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .layer-toggle:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.1);
        }

        .layer-toggle.active {
            background: rgba(102, 126, 234, 0.1);
            border-color: rgba(102, 126, 234, 0.3);
        }

        .layer-color {
            width: 12px;
            height: 12px;
            border-radius: 2px;
            margin-right: 12px;
        }

        .layer-name {
            flex: 1;
            font-size: 13px;
            color: #e0e0e0;
        }

        .layer-count {
            font-size: 11px;
            color: #666;
        }

        .divider {
            height: 1px;
            background: rgba(255, 255, 255, 0.05);
            margin: 25px 0;
        }

        /* Search */
        .search-box {
            width: 100%;
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 6px;
            color: #fff;
            font-size: 13px;
            margin-bottom: 20px;
            outline: none;
            transition: all 0.2s;
        }

        .search-box:focus {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(102, 126, 234, 0.5);
        }

        .search-box::placeholder {
            color: #666;
        }

        /* Bottom info */
        .bottom-info {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(10, 14, 23, 0.9);
            backdrop-filter: blur(20px);
            padding: 15px 20px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 11px;
            color: #666;
            z-index: 8;
        }

        /* Mapbox controls */
        .mapboxgl-ctrl-group {
            background: rgba(10, 14, 23, 0.9) !important;
            border: 1px solid rgba(255, 255, 255, 0.05) !important;
        }

        .mapboxgl-ctrl-group button {
            background: transparent !important;
            border: none !important;
        }

        .mapboxgl-ctrl-group button + button {
            border-top: 1px solid rgba(255, 255, 255, 0.05) !important;
        }

        .mapboxgl-ctrl-icon {
            filter: invert(1);
        }

        /* Popup */
        .mapboxgl-popup-content {
            background: rgba(10, 14, 23, 0.95);
            backdrop-filter: blur(20px);
            color: #e0e0e0;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .mapboxgl-popup-close-button {
            color: #999;
            font-size: 18px;
        }

        .popup-title {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #fff;
        }

        .popup-row {
            display: flex;
            margin-bottom: 8px;
            font-size: 12px;
        }

        .popup-label {
            color: #666;
            min-width: 90px;
        }

        .popup-value {
            color: #e0e0e0;
            font-weight: 500;
        }

        /* Loading */
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 100;
            background: rgba(10, 14, 23, 0.95);
            padding: 30px 50px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
        }

        .loading.hidden {
            display: none;
        }

        .spinner {
            width: 30px;
            height: 30px;
            border: 2px solid rgba(102, 126, 234, 0.2);
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 12px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- Loading -->
    <div class="loading" id="loading">
        <div class="spinner"></div>
        <div style="font-size: 13px; color: #999;">Loading grid data...</div>
    </div>

    <!-- Top Bar -->
    <div class="top-bar">
        <div class="logo">UK Energy Grid</div>
        <div class="stats-mini">
            <div class="stat-mini">Projects<span id="projectCount">2,219</span></div>
            <div class="stat-mini">Capacity<span>81.7 GW</span></div>
            <div class="stat-mini">Queue<span>741 GW</span></div>
        </div>
    </div>

    <!-- Left Sidebar -->
    <div class="sidebar">
        <input type="text" class="search-box" placeholder="Search projects, locations..." id="searchBox">

        <h3>Infrastructure Layers</h3>

        <div class="layer-toggle active" data-layer="gsp-boundaries">
            <div class="layer-color" style="background: #667eea;"></div>
            <div class="layer-name">GSP Regions</div>
            <div class="layer-count">329</div>
        </div>

        <div class="layer-toggle" data-layer="projects">
            <div class="layer-color" style="background: #ffd93d;"></div>
            <div class="layer-name">Connection Queue</div>
            <div class="layer-count">2,219</div>
        </div>

        <div class="layer-toggle" data-layer="transmission">
            <div class="layer-color" style="background: #6bcf7f;"></div>
            <div class="layer-name">Transmission Lines</div>
            <div class="layer-count">-</div>
        </div>

        <div class="divider"></div>

        <h3>Technology Filters</h3>

        <div class="layer-toggle active" data-filter="storage">
            <div class="layer-color" style="background: #667eea;"></div>
            <div class="layer-name">Energy Storage</div>
            <div class="layer-count">744</div>
        </div>

        <div class="layer-toggle active" data-filter="solar">
            <div class="layer-color" style="background: #ffd93d;"></div>
            <div class="layer-name">Solar + Storage</div>
            <div class="layer-count">443</div>
        </div>

        <div class="layer-toggle active" data-filter="wind">
            <div class="layer-color" style="background: #6bcf7f;"></div>
            <div class="layer-name">Wind</div>
            <div class="layer-count">459</div>
        </div>

        <div class="layer-toggle active" data-filter="other">
            <div class="layer-color" style="background: #999;"></div>
            <div class="layer-name">Other</div>
            <div class="layer-count">573</div>
        </div>
    </div>

    <!-- Map -->
    <div id="map"></div>

    <!-- Bottom Info -->
    <div class="bottom-info">
        Data: NESO TEC Register • Updated Nov 2026
    </div>

    <script src="config.js" onerror="console.log('Config not found')"></script>
    <script src="app.js"></script>
</body>
</html>
